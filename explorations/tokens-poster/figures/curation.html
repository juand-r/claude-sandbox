<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What curation changed</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
html, body { margin: 0; background: transparent }
#figure { position: relative; width: 965px; height: 200px; font-family: Archivo, 'Helvetica Neue', sans-serif; color: #14161A }
#figure div { position: absolute; box-sizing: border-box }
.lab { left: 0; width: 222px; text-align: right; font-size: 26px; font-weight: 700; line-height: 34px }
.bar { height: 22px; border-radius: 4px }
.num { font-size: 26px; font-weight: 700; line-height: 34px }
.ex { width: 719px; font-size: 22px; line-height: 26px; color: #4A4F57 }
</style>
</head>
<body>
<div id="figure">
<div class="lab" style="top: 6px">Added</div><div class="bar" style="top: 12px; left: 246px; width: 320px; background: #2E8B57"></div><div class="num" style="top: 6px; left: 578px">4,961</div><div class="ex" style="top: 40px; left: 246px">splits MorphyNet does not list</div>
<div class="lab" style="top: 70px">Re-segmented</div><div class="bar" style="top: 76px; left: 246px; width: 254px; background: #2F5D9B"></div><div class="num" style="top: 70px; left: 512px">3,933</div><div class="ex" style="top: 104px; left: 246px">kingdom: kin + ing + dom → king + dom</div>
<div class="lab" style="top: 134px">Rejected</div><div class="bar" style="top: 140px; left: 246px; width: 72px; background: #C8483A"></div><div class="num" style="top: 134px; left: 330px">1,114</div><div class="ex" style="top: 168px; left: 246px">business: busy + ness → kept whole</div>
</div>
</body>
</html>
