<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evidence pooling</title>
<!-- Overview figure: three word forms share one stem token, so all three train one embedding.
     Example from the paper, Sec. 5.1 (help pools signal from helped, helping, helps).
     949 x 300 px on the A0 artboard. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
html, body { margin: 0; background: transparent }
#figure { position: relative; width: 949px; height: 300px; font-family: Archivo, 'Helvetica Neue', sans-serif; color: #14161A }
#figure div { position: absolute; box-sizing: border-box }
.row { left: 0; height: 64px; display: flex; gap: 10px; align-items: center }
.chip { position: static !important; font-size: 34px; line-height: 1; padding: 12px 14px; border-radius: 12px; border: 3px solid #2E8B57; background: #E3F2E8 }
.chip.stem { border: 5px solid #2F5D9B; padding: 10px 12px; font-weight: 700 }
.emb { left: 520px; top: 96px; width: 429px; height: 108px; background: #FFFFFF; border: 4px solid #2F5D9B; border-radius: 18px;
       display: flex; align-items: center; gap: 22px; padding: 0 24px }
.emb b { font-size: 40px; color: #2F5D9B }
.cells { position: static !important; display: flex; gap: 6px }
.cells span { display: block; width: 26px; height: 46px; border-radius: 5px; background: #2F5D9B }
.label { left: 520px; top: 220px; width: 429px; text-align: center; font-size: 27px; line-height: 1.3; color: #4A4F57; text-wrap: balance }
</style>
</head>
<body>
<div id="figure">
<div class="row" style="top: 18px"><span class="chip stem">help</span><span class="chip">ed</span></div>
<div class="row" style="top: 118px"><span class="chip stem">help</span><span class="chip">ing</span></div>
<div class="row" style="top: 218px"><span class="chip stem">help</span><span class="chip">s</span></div>
<svg width="949" height="300" style="position: absolute; left: 0; top: 0; overflow: visible" aria-hidden="true">
<defs><marker id="h" orient="auto" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5"><path d="M0 0 L5 2.5 L0 5 Z" fill="#2F5D9B"/></marker></defs>
<path d="M 250 50 C 380 50, 400 130, 500 140" stroke="#2F5D9B" stroke-width="5" fill="none" marker-end="url(#h)"/>
<path d="M 250 150 L 500 150" stroke="#2F5D9B" stroke-width="5" fill="none" marker-end="url(#h)"/>
<path d="M 250 250 C 380 250, 400 170, 500 160" stroke="#2F5D9B" stroke-width="5" fill="none" marker-end="url(#h)"/>
</svg>
<div class="emb"><b>help</b><div class="cells"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
<div class="label">one embedding, trained by every form</div>
</div>
</body>
</html>
