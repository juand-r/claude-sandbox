<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lemma-level morphemes</title>
<!-- Method figure: spelling variants of one morpheme map to one token (paper Sec. 3.3).
     949 x 170 px on the A0 artboard. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
html, body { margin: 0; background: transparent }
#figure { position: relative; width: 949px; height: 170px; font-family: Archivo, 'Helvetica Neue', sans-serif; color: #14161A; display: flex; flex-direction: column; gap: 26px; justify-content: center }
.row { display: flex; align-items: center; gap: 12px }
.chip { display: inline-block; font-size: 32px; line-height: 1; padding: 12px 14px; border-radius: 12px; border: 3px solid #9AA1AA; background: #FFFFFF }
.chip.one { border: 5px solid #2F5D9B; background: #E3F2E8; font-weight: 700; padding: 10px 12px }
.arrow { font-size: 40px; color: #2F5D9B; margin: 0 14px }
.what { font-size: 26px; color: #4A4F57; margin-left: 18px }
</style>
</head>
<body>
<div id="figure">
<div class="row"><span class="chip">-s</span><span class="chip">-es</span><span class="chip">-ies</span><span class="arrow">→</span><span class="chip one">-s</span><span class="what">plural</span></div>
<div class="row"><span class="chip">in-</span><span class="chip">im-</span><span class="chip">il-</span><span class="chip">ir-</span><span class="arrow">→</span><span class="chip one">in-</span><span class="what">negative prefix</span></div>
</div>
</body>
</html>
